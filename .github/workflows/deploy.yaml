name: Deploy Frontend
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.anirbanx }} -p ${{ secrets.Commonpwdkuchu01$ }}
      - run: docker build -t anirbanx/react2-test -f Dockerfile.dev .
      - run: docker run -e CI=true anirbanx/react2-test npm run test
